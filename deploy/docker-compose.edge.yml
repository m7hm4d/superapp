# حافة TLS مشتركة. ‏Caddy واحد على الخادم يخدم البيئتين — لأن 80 و443 لا
# يمكن أن يربطهما أكثر من عملية، ولأن ACME يحتاجهما فعلاً.
#
# لكل حزمة شبكة حافة خاصة بها، وCaddy وحده ينضم إليهما معاً: حاوية في
# بيئة التجربة لا تصل إلى `prod-api` إلا عبره. شبكة واحدة مشتركة كانت تتيح
# الانتقال الجانبي وتزوير X-Forwarded-For على الإنتاج.
#
#   docker network create superapp-edge-prod     ← مرة واحدة لكل بيئة
#   docker network create superapp-edge-stage
#   docker compose -f deploy/docker-compose.edge.yml --env-file .env.edge up -d

name: superapp-edge

services:
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL مطلوب}
      PROD_ADMIN_DOMAIN: ${PROD_ADMIN_DOMAIN:?PROD_ADMIN_DOMAIN مطلوب}
      PROD_API_DOMAIN: ${PROD_API_DOMAIN:?PROD_API_DOMAIN مطلوب}
      # نطاقا التجربة اختياريان: الافتراضي ‎.localhost يجعل Caddy يصدر شهادة
      # داخلية بدل أن يقصد Let's Encrypt لنطاق لا وجود له في DNS.
      STAGE_ADMIN_DOMAIN: ${STAGE_ADMIN_DOMAIN:-stage-admin.localhost}
      STAGE_API_DOMAIN: ${STAGE_API_DOMAIN:-stage-api.localhost}
      # النطاق الجذر للصفحة التعريفية
      SITE_DOMAIN: ${SITE_DOMAIN:-4irq.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # يُربط **المجلد الأب** لا `./site` مباشرة.
      #
      # ‏`deploy/site` يُنشأ ويُحذف مع تبديل الفروع، والربط يمسك مُعرِّف الملف
      # (inode) لا مساره: فمتى حُذف المجلد وأُعيد، ظلّت الحاوية تنظر إلى
      # المحذوف وترى فراغاً. وقع هذا فعلاً — الصفحة ردّت 404 بعد `git checkout`
      # بينما الملف على القرص سليم، وشيء في السجلات لا يشير إلى السبب.
      #
      # و`deploy/` موجود على كل فرع فلا يزول، فيبقى الربط صحيحاً.
      - ./:/srv/deploy:ro
      # الشهادات هنا — فقدان هذا الحجم يعني إعادة إصدار واصطداماً بحدود
      # المعدل عند التكرار.
      - caddy_data:/data
      - caddy_config:/config
    # الوحيد المنضمّ إلى الشبكتين: أي حركة بين البيئتين يجب أن تمرّ به
    networks: [edge_prod, edge_stage]

networks:
  edge_prod:
    external: true
    name: superapp-edge-${PROD_STACK_NAME:-prod}
  edge_stage:
    external: true
    name: superapp-edge-${STAGE_STACK_NAME:-stage}

volumes:
  caddy_data:
  caddy_config:
