packages:
  - "apps/*"
  - "packages/*"
overrides:
  # ثغرات في نسخ متعدية لا تملك حزمها ترقيةً بعد. تُحذف عند لحاق المنبع.
  # ‏postcss: تجاوز مسار عبر sourceMappingURL و XSS في stringify — نستهلكه
  # وقت البناء على CSS من المستودع نفسه، والترقية داخل 8.x مستقرة الواجهة.
  postcss: ^8.5.23
  # ‏sharp: ثغرات libvips الموروثة (CVE-2026-33327 وأخواتها). يستدعيه next
  # لتحسين الصور، فالمدخل قد يكون صورة من الخارج.
  sharp: ^0.35.0
  react-native-reanimated: ~4.1.1
  expo-secure-store: ~15.0.0
  "@expo/vector-icons": ~15.0.0
  react-native: 0.81.5
  react: 19.1.0
  react-dom: 19.1.0
allowBuilds:
  '@swc/core': true
  argon2: true
  esbuild: true
  sharp: true
  # يجرّه jest-resolve@30 — محلّل مسارات أصلي. بلا إذن البناء يفشل أي أمر
  # pnpm بـERR_PNPM_IGNORED_BUILDS لا اختبارات jest وحدها.
  unrs-resolver: true
