# النشر على VPS. الفرق الجوهري عن docker-compose.yml (بيئة التطوير):
#   • لا منفذ مكشوفاً إلا 80/443 عبر Caddy — القاعدة والـAPI واللوحة على شبكة داخلية.
#   • الهجرات تُطبَّق في خدمة لمرة واحدة قبل إقلاع الـAPI، لا يدوياً.
#   • ‏restart: unless-stopped على كل خدمة دائمة — تعود بعد إعادة تشغيل الخادم.
#
#   ./deploy/deploy.sh                    ← الإنتاج
#   ./deploy/deploy.sh --env .env.stage    ← بيئة التجربة
#
# الصور تُسحب من GHCR ولا تُبنى هنا: البناء يحدث في CI مرة واحدة، والناتج
# موقَّع. البناء محلياً للتطوير عبر docker-compose.build.yml.

# ‏STACK_NAME يفصل بيئتين على خادم واحد: أسماء الحاويات والأحجام والشبكة
# الداخلية كلها مشتقّة منه، فقاعدة التجربة لا تلمس قاعدة الإنتاج أبداً.
name: superapp-${STACK_NAME:?STACK_NAME مطلوب (prod أو stage)}

services:
  db:
    image: postgis/postgis:17-3.5@sha256:45f2a608397fa67d236b012c14a9e3ea31e9fe813edbeb5c1c0d1acbf0d48ea9
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER مطلوب}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD مطلوب}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB مطلوب}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # لا ports — القاعدة لا تُعرَّض للإنترنت. الوصول من المضيف عبر
    # docker compose exec db psql، أو نفق SSH عند الحاجة.

  # تطبّق الهجرات ثم تخرج. الـAPI لا يقلع قبل نجاحها، فلا تعمل نسخة
  # جديدة على مخطط قديم.
  migrate:
    image: ${API_IMAGE:?API_IMAGE مطلوب}
    restart: 'no'
    # بلا قيمة افتراضية عمداً. القيمة الافتراضية هنا كانت الخلل نفسه: أمرٌ
    # يستهدف التجربة وينسى ENV_FILE كان **ينجح** ويسلّم الحاوية بيئة الإنتاج،
    # فتُسمّى superapp-stage-api وتحمل رابط قاعدة الإنتاج وأسرارها. الخطأ
    # الصامت أخطر من الخطأ الصاخب — فليصرخ.
    env_file: ['${ENV_FILE:?ENV_FILE مطلوب — استعمل deploy/compose.sh أو deploy/deploy.sh}']
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'dist/apps/api/src/db/migrate.js']

  api:
    image: ${API_IMAGE:?API_IMAGE مطلوب}
    restart: unless-stopped
    # بلا قيمة افتراضية عمداً. القيمة الافتراضية هنا كانت الخلل نفسه: أمرٌ
    # يستهدف التجربة وينسى ENV_FILE كان **ينجح** ويسلّم الحاوية بيئة الإنتاج،
    # فتُسمّى superapp-stage-api وتحمل رابط قاعدة الإنتاج وأسرارها. الخطأ
    # الصامت أخطر من الخطأ الصاخب — فليصرخ.
    env_file: ['${ENV_FILE:?ENV_FILE مطلوب — استعمل deploy/compose.sh أو deploy/deploy.sh}']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ['3000']
    networks:
      default: {}
      # الاسم الذي يعرفه Caddy المشترك. لا يمكن استعمال اسم الخدمة لأن
      # الحزمتين تحملان الأسماء نفسها على شبكتيهما الداخليتين.
      edge:
        aliases: ['${STACK_NAME}-api']

  admin:
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE مطلوب}
    restart: unless-stopped
    depends_on: [api]
    expose: ['3001']
    networks:
      default: {}
      edge:
        aliases: ['${STACK_NAME}-admin']

networks:
  # تُنشأ مرة واحدة على الخادم: docker network create superapp-edge
  edge:
    external: true
    name: superapp-edge

volumes:
  dbdata:
