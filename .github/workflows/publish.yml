name: Publish

# Only the current workflow on main may build or promote images. A Git tag does
# not trigger Actions: release promotion is an explicit dispatch from main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable Git tag to promote (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Resolve immutable source commit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve and validate the source commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          [[ "$EVENT_REF" == 'refs/heads/main' ]] || {
            echo "Publish must run from refs/heads/main" >&2
            exit 1
          }
          [[ "$EVENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "invalid workflow commit SHA" >&2
            exit 1
          }
          checked_out=$(git rev-parse HEAD)
          [[ "${checked_out,,}" == "${EVENT_SHA,,}" ]] || {
            echo "checkout does not match the workflow commit" >&2
            exit 1
          }

          case "$EVENT_NAME" in
            push)
              [[ -z "$RELEASE_TAG" ]] || exit 1
              source_sha="${EVENT_SHA,,}"
              release_tag=''
              ;;
            workflow_dispatch)
              [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
                echo "release_tag must use stable vMAJOR.MINOR.PATCH syntax" >&2
                exit 1
              }
              git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}" || {
                echo "release tag does not exist" >&2
                exit 1
              }
              source_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
              [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
                echo "release tag does not resolve to a commit" >&2
                exit 1
              }
              git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main || {
                echo "release tag commit is not an ancestor of origin/main" >&2
                exit 1
              }
              release_tag="$RELEASE_TAG"
              ;;
            *)
              echo "unsupported Publish event" >&2
              exit 1
              ;;
          esac

          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

  gates:
    name: Verify exact-commit gates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate script must come from the current workflow on main, while
          # TARGET_SHA can be an older release commit.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for CI, CodeQL, Security, and contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.prepare.outputs.source_sha }}
          GATE_TIMEOUT_SECONDS: '2700'
          GATE_POLL_SECONDS: '15'
        run: python3 scripts/wait-for-workflow-gates.py

  publish:
    name: Build, scan, and sign ${{ matrix.image }}
    needs: [prepare, gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Serialise every attempt to publish the same image for the same source
    # commit. A rerun can only reuse the guarded tag; it cannot move it.
    concurrency:
      group: publish-${{ needs.prepare.outputs.source_sha }}-${{ matrix.image }}
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image: superapp-api
            dockerfile: apps/api/Dockerfile
          - app: admin
            image: superapp-admin
            dockerfile: apps/admin/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # If the guarded SHA tag already exists, a rerun must prove it belongs to
      # this source and main workflow, then reuse it without build or retag.
      - name: Resolve an existing guarded SHA image
        id: existing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_NAME: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail

          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          source_sha="${SOURCE_SHA,,}"
          image="ghcr.io/${OWNER,,}/${IMAGE_NAME}"
          tag="sha-${source_sha}"
          image_json=$(mktemp)
          state_json=$(mktemp)
          trap 'rm -f -- "$image_json" "$state_json"' EXIT

          python3 scripts/check-registry-tag.py probe "$image" "$tag" > "$state_json"
          state=$(jq -er '.state' "$state_json")
          if [[ "$state" == 'absent' ]]; then
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$state" == 'present' ]] || {
            echo "registry returned an invalid tag state" >&2
            exit 1
          }
          digest=$(jq -er '.digest' "$state_json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "existing SHA tag has an invalid digest" >&2
            exit 1
          }
          timeout 30s docker buildx imagetools inspect \
            --format '{{json .Image}}' \
            "${image}@${digest}" > "$image_json"
          revision=$(jq -er '.config.Labels["org.opencontainers.image.revision"]' "$image_json")
          [[ "${revision,,}" == "$source_sha" ]] || {
            echo "existing SHA image has the wrong OCI revision" >&2
            exit 1
          }
          timeout 60s cosign verify \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/publish.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$source_sha" \
            "${image}@${digest}" > /dev/null

          python3 scripts/check-registry-tag.py require-digest "$image" "$tag" "$digest"
          printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - id: meta
        if: steps.existing.outputs.exists == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: type=sha,format=long

      # Push by digest without any tag. The guarded sha-<40> name is created
      # only after the registry artifact passes scan, revision, and signature.
      - name: Build and push an untagged image digest
        if: steps.existing.outputs.exists == 'false'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: true
          sbom: true

      - name: Create trusted Trivy policy
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          umask 077
          printf '{}\n' > "$RUNNER_TEMP/trivy-blocking.yaml"
          printf '%s\n' \
            'vulnerabilities: []' \
            'misconfigurations: []' \
            'secrets: []' \
            'licenses: []' \
            > "$RUNNER_TEMP/trivy-empty-ignore.yaml"

      - name: Scan the published image digest
        if: steps.existing.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          trivy-config: ${{ runner.temp }}/trivy-blocking.yaml
          trivyignores: ${{ runner.temp }}/trivy-empty-ignore.yaml
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Verify the built OCI revision
        if: steps.existing.outputs.exists == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          image="ghcr.io/${OWNER,,}/${IMAGE_NAME}"
          revision=$(
            docker buildx imagetools inspect \
              --format '{{json .Image}}' \
              "${image}@${DIGEST}" |
              jq -er '.config.Labels["org.opencontainers.image.revision"]'
          )
          [[ "${revision,,}" == "${SOURCE_SHA,,}" ]] || {
            echo "built image OCI revision does not match the source SHA" >&2
            exit 1
          }

      - name: Sign the scanned image digest
        if: steps.existing.outputs.exists == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Guard the immutable SHA tag
        id: guarded
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          EXISTING_IMAGE: ${{ steps.existing.outputs.exists }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_NAME: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail

          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          source_sha="${SOURCE_SHA,,}"
          image="ghcr.io/${OWNER,,}/${IMAGE_NAME}"
          tag="sha-${source_sha}"
          target="${image}:${tag}"
          digest="$BUILT_DIGEST"
          if [[ "$EXISTING_IMAGE" == 'true' ]]; then
            digest="$EXISTING_DIGEST"
          elif [[ "$EXISTING_IMAGE" != 'false' ]]; then
            echo "invalid existing-image state" >&2
            exit 1
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1

          image_json=$(mktemp)
          state_json=$(mktemp)
          trap 'rm -f -- "$image_json" "$state_json"' EXIT
          docker buildx imagetools inspect \
            --format '{{json .Image}}' \
            "${image}@${digest}" > "$image_json"
          revision=$(jq -er '.config.Labels["org.opencontainers.image.revision"]' "$image_json")
          [[ "${revision,,}" == "$source_sha" ]] || {
            echo "image OCI revision does not match the guarded SHA" >&2
            exit 1
          }
          cosign verify \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/publish.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$source_sha" \
            "${image}@${digest}" > /dev/null

          if [[ "$EXISTING_IMAGE" == 'true' ]]; then
            python3 scripts/check-registry-tag.py require-digest "$image" "$tag" "$digest"
          else
            python3 scripts/check-registry-tag.py probe "$image" "$tag" > "$state_json"
            state=$(jq -er '.state' "$state_json")
            if [[ "$state" == 'present' ]]; then
              appeared=$(jq -er '.digest' "$state_json")
              [[ "$appeared" == "$digest" ]] || {
                echo "a different guarded SHA tag appeared during the build" >&2
                exit 1
              }
            elif [[ "$state" == 'absent' ]]; then
              # Only an authoritative double 404/MANIFEST_UNKNOWN check may
              # reach the create operation. Timeouts/auth/429/5xx fail closed.
              python3 scripts/check-registry-tag.py require-absent "$image" "$tag"
              set +e
              docker buildx imagetools create \
                --prefer-index=false \
                --tag "$target" \
                "${image}@${digest}"
              create_status=$?
              set -e
              if (( create_status != 0 )); then
                echo "::warning::SHA tag create returned status ${create_status}; reconciling the registry state"
              fi
              # The command can disconnect after GHCR accepts the mutation.
              # Its exit code is therefore never authoritative: only an exact
              # registry read can reconcile success without moving the tag.
              python3 scripts/check-registry-tag.py require-digest "$image" "$tag" "$digest"
            else
              echo "registry returned an invalid tag state" >&2
              exit 1
            fi
          fi

          python3 scripts/check-registry-tag.py require-digest "$image" "$tag" "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DIGEST: ${{ steps.guarded.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          {
            echo "### ${IMAGE_NAME}"
            echo
            echo '```'
            echo "ghcr.io/${OWNER,,}/${IMAGE_NAME}@${DIGEST}"
            echo "ghcr.io/${OWNER,,}/${IMAGE_NAME}:sha-${SOURCE_SHA,,}"
            echo '```'
            echo
            echo 'The digest is immutable; the SHA tag is guarded against movement by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Verify SHA artifacts and create GitHub release
    needs: [prepare, gates]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    concurrency:
      group: release-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false

    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify guarded images and create the idempotent release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GITHUB_API_ENDPOINT: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_API_ENDPOINT" == https://* ]] || exit 1
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          [[ "$OWNER" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          source_sha="${SOURCE_SHA,,}"
          owner="${OWNER,,}"
          api_image="ghcr.io/${owner}/superapp-api"
          admin_image="ghcr.io/${owner}/superapp-admin"
          source_tag="sha-${source_sha}"
          api_response=$(mktemp)
          image_json=$(mktemp)
          notes_file=$(mktemp)
          release_request=$(mktemp)
          state_json=$(mktemp)
          trap 'rm -f -- "$api_response" "$image_json" "$notes_file" "$release_request" "$state_json"' EXIT

          github_get() {
            local url="$1"
            local output="$2"
            local curl_status

            set +e
            HTTP_STATUS=$(
              curl \
                -q \
                --silent \
                --show-error \
                --retry 3 \
                --retry-all-errors \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$output" \
                --write-out '%{http_code}' \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$url"
            )
            curl_status=$?
            set -e
            [[ "$curl_status" -eq 0 && "$HTTP_STATUS" =~ ^[0-9]{3}$ ]] || {
              echo "GitHub API GET failed without an authoritative response" >&2
              return 1
            }
          }

          resolve_remote_tag() {
            local object_sha object_type
            github_get \
              "${GITHUB_API_ENDPOINT%/}/repos/${REPOSITORY}/git/ref/tags/${TAG}" \
              "$api_response"
            [[ "$HTTP_STATUS" == '200' ]] || {
              echo "release Git tag lookup returned HTTP ${HTTP_STATUS}" >&2
              return 1
            }
            object_sha=$(jq -er '.object.sha' "$api_response")
            object_type=$(jq -er '.object.type' "$api_response")
            for _ in 1 2 3 4 5; do
              [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
              case "$object_type" in
                commit)
                  printf '%s\n' "${object_sha,,}"
                  return 0
                  ;;
                tag)
                  github_get \
                    "${GITHUB_API_ENDPOINT%/}/repos/${REPOSITORY}/git/tags/${object_sha}" \
                    "$api_response"
                  [[ "$HTTP_STATUS" == '200' ]] || return 1
                  object_sha=$(jq -er '.object.sha' "$api_response")
                  object_type=$(jq -er '.object.type' "$api_response")
                  ;;
                *) return 1 ;;
              esac
            done
            echo "release Git tag annotation chain is too deep" >&2
            return 1
          }

          verify_release_response() {
            jq -e \
              --arg tag "$TAG" \
              --rawfile notes "$notes_file" \
              '.tag_name == $tag and .name == $tag and .body == $notes and .draft == false and .prerelease == false and (.assets | type == "array" and length == 0)' \
              "$api_response" > /dev/null || {
              echo "existing GitHub Release differs; refusing to overwrite it" >&2
              return 1
            }
          }

          deadline=$((SECONDS + 1800))
          api_digest=''
          admin_digest=''
          for image_name in superapp-api superapp-admin; do
            image="ghcr.io/${owner}/${image_name}"
            digest=''
            while (( SECONDS < deadline )); do
              python3 scripts/check-registry-tag.py probe "$image" "$source_tag" > "$state_json"
              state=$(jq -er '.state' "$state_json")
              if [[ "$state" == 'present' ]]; then
                digest=$(jq -er '.digest' "$state_json")
                break
              fi
              [[ "$state" == 'absent' ]] || exit 1
              echo "waiting for guarded ${image_name}:${source_tag}"
              sleep 10
            done
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "guarded ${image_name} image did not appear" >&2
              exit 1
            }
            timeout 30s docker buildx imagetools inspect \
              --format '{{json .Image}}' \
              "${image}@${digest}" > "$image_json"
            revision=$(jq -er '.config.Labels["org.opencontainers.image.revision"]' "$image_json")
            [[ "${revision,,}" == "$source_sha" ]] || {
              echo "${image_name} has the wrong OCI revision" >&2
              exit 1
            }
            timeout 60s cosign verify \
              --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/publish.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-sha "$source_sha" \
              "${image}@${digest}" > /dev/null
            python3 scripts/check-registry-tag.py require-digest "$image" "$source_tag" "$digest"
            case "$image_name" in
              superapp-api) api_digest="$digest" ;;
              superapp-admin) admin_digest="$digest" ;;
              *) exit 1 ;;
            esac
          done

          {
            echo '## Immutable container images'
            echo
            echo '```'
            echo "${api_image}@${api_digest}"
            echo "${admin_image}@${admin_digest}"
            echo '```'
            echo
            echo "Source commit: ${source_sha}"
            echo
            echo 'GHCR SemVer aliases are not created. Deploy the guarded full-SHA tag only.'
            echo
            echo '## Verify signatures'
            echo
            echo '```bash'
            echo "for subject in \\"
            echo "  ${api_image}@${api_digest} \\"
            echo "  ${admin_image}@${admin_digest}; do"
            echo "  cosign verify \\"
            echo "    --certificate-identity https://github.com/${REPOSITORY}/.github/workflows/publish.yml@refs/heads/main \\"
            echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "    --certificate-github-workflow-sha ${source_sha} \\"
            echo "    \"\$subject\""
            echo 'done'
            echo '```'
            echo
            echo '## Deploy'
            echo
            echo '```bash'
            echo "./deploy/deploy.sh sha-${source_sha}"
            echo "./deploy/deploy.sh --env .env.stage sha-${source_sha}"
            echo '```'
          } > "$notes_file"

          remote_source=$(resolve_remote_tag)
          [[ "$remote_source" == "$source_sha" ]] || {
            echo "remote Git tag no longer resolves to the gated source SHA" >&2
            exit 1
          }

          release_url="${GITHUB_API_ENDPOINT%/}/repos/${REPOSITORY}/releases/tags/${TAG}"
          github_get "$release_url" "$api_response"
          case "$HTTP_STATUS" in
            200)
              verify_release_response
              final_source=$(resolve_remote_tag)
              [[ "$final_source" == "$source_sha" ]] || exit 1
              echo "existing GitHub Release is identical and remains bound to ${source_sha}"
              exit 0
              ;;
            404)
              jq -e '.message == "Not Found"' "$api_response" > /dev/null || {
                echo "GitHub Release 404 response was not authoritative" >&2
                exit 1
              }
              ;;
            *)
              echo "GitHub Release lookup returned HTTP ${HTTP_STATUS}" >&2
              exit 1
              ;;
          esac

          jq -n \
            --arg tag "$TAG" \
            --arg name "$TAG" \
            --rawfile body "$notes_file" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, generate_release_notes: false}' \
            > "$release_request"

          # The remote tag is checked again directly before the sole release
          # mutation. Protected immutable v* Git tags remain an operational
          # repository requirement because GitHub offers no cross-API CAS.
          remote_source=$(resolve_remote_tag)
          [[ "$remote_source" == "$source_sha" ]] || {
            echo "remote Git tag moved immediately before release creation" >&2
            exit 1
          }

          set +e
          HTTP_STATUS=$(
            curl \
              -q \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --request POST \
              --output "$api_response" \
              --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Content-Type: application/json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary "@${release_request}" \
              "${GITHUB_API_ENDPOINT%/}/repos/${REPOSITORY}/releases"
          )
          post_status=$?
          set -e

          if [[ "$post_status" -eq 0 && "$HTTP_STATUS" == '201' ]]; then
            verify_release_response
          else
            # A lost POST response or a concurrent identical creator is
            # reconciled read-only. GitHub can briefly return 404 while an
            # accepted release becomes visible, so poll within a strict bound.
            reconcile_deadline=$((SECONDS + 90))
            reconciled=false
            while (( SECONDS < reconcile_deadline )); do
              current_source=$(resolve_remote_tag)
              [[ "$current_source" == "$source_sha" ]] || {
                echo "remote Git tag moved during release reconciliation" >&2
                exit 1
              }
              github_get "$release_url" "$api_response"
              case "$HTTP_STATUS" in
                200)
                  # A visible but incompatible release is definitive: never
                  # overwrite or wait for it to change.
                  verify_release_response
                  reconciled=true
                  break
                  ;;
                404)
                  jq -e '.message == "Not Found"' "$api_response" > /dev/null || exit 1
                  ;;
                429 | 500 | 502 | 503 | 504) ;;
                *)
                  echo "release reconciliation returned HTTP ${HTTP_STATUS}" >&2
                  exit 1
                  ;;
              esac
              sleep 3
            done
            $reconciled || {
              echo "release creation was not authoritatively reconciled within 90 seconds" >&2
              exit 1
            }
          fi

          final_source=$(resolve_remote_tag)
          [[ "$final_source" == "$source_sha" ]] || {
            echo "remote Git tag moved during release creation" >&2
            exit 1
          }
          {
            echo "### ${TAG}"
            echo
            echo "${api_image}@${api_digest}"
            echo "${admin_image}@${admin_digest}"
          } >> "$GITHUB_STEP_SUMMARY"
