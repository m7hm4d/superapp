name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      db:
        image: postgis/postgis:17-3.5@sha256:45f2a608397fa67d236b012c14a9e3ea31e9fe813edbeb5c1c0d1acbf0d48ea9
        env:
          POSTGRES_USER: superapp
          POSTGRES_PASSWORD: superapp
          POSTGRES_DB: superapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superapp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgres://superapp:superapp@localhost:5432/superapp
      JWT_ACCESS_SECRET: ci-only-access-secret-0000000000
      JWT_REFRESH_SECRET: ci-only-refresh-secret-000000000
      SEED_ADMIN_PASSWORD: ci-only-admin-password-00000000
      # سر TOTP ثابت للاختبارات الآلية فقط (base32) — TOTP إلزامي لدخول الإدارة
      SEED_ADMIN_TOTP_SECRET: KRSXG5CTMVRXEZLUKBSGC5DBORSA
      # نافذة قصيرة وحد أوسع: الاختبارات المتوازية تشترك في IP واحد، والمهم
      # إثبات أن الحد يرفض فعلاً (الإنتاج يبقى على 5/دقيقة الافتراضيين)
      # WebAuthn في الاختبارات: نطاق التطوير المسموح به في المواصفة
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGINS: http://localhost:3001
      AUTH_THROTTLE_LIMIT: 60
      AUTH_THROTTLE_TTL_MS: 3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm run typecheck

      - name: Migrate database
        run: pnpm --filter @superapp/api db:migrate

      - name: Seed database
        run: pnpm --filter @superapp/api db:seed

      # مع التغطية: العتبات في vitest.config تُسقط الخطوة عند الانحدار،
      # والملخّص يُطبع في السجل فيُرى الرقم بلا فتح تقرير.
      - name: API e2e tests + coverage
        run: pnpm --filter @superapp/api test:coverage

      - name: Build admin dashboard
        run: pnpm --filter @superapp/admin build

  # ‏job مستقل لا خطوة داخل test: الفحص النمطي ينتهي في نحو دقيقة، فيصل
  # خبر السقوط بدل انتظار أربع دقائق تقضيها قاعدة البيانات والاختبارات.
  # التحذيرات لا توقف البناء بعد — تُجمع أولاً ثم يُشدَّد الحدّ.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  # حزمة النشر لا يلمسها job الاختبارات إطلاقاً: ملفات Compose وCaddy
  # وDockerfileات تُكسر بصمت ولا يُكتشف ذلك إلا على الخادم. يعمل بالتوازي
  # مع test فلا يطيل زمن CI.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # أسرار وهمية: هذا الـjob يتحقق من صحة التركيب لا من قيم الإنتاج
      - name: Materialise a throwaway .env.prod
        run: |
          sed -e 's|^POSTGRES_PASSWORD=$|POSTGRES_PASSWORD=ci-only-password|' \
              -e 's|^DATABASE_URL=.*|DATABASE_URL=postgres://superapp:ci-only-password@db:5432/superapp|' \
              -e 's|^JWT_ACCESS_SECRET=$|JWT_ACCESS_SECRET=ci-only-access-secret-000000|' \
              -e 's|^JWT_REFRESH_SECRET=$|JWT_REFRESH_SECRET=ci-only-refresh-secret-00000|' \
              -e 's|^ACME_EMAIL=.*|ACME_EMAIL=ci@example.com|' \
              .env.prod.example > .env.prod

      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e ADMIN_DOMAIN=admin.example.com \
            -e API_DOMAIN=api.example.com \
            -e ACME_EMAIL=ci@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod build

      # الامتياز الأقل يُفحص لا يُفترض: `USER node` في Dockerfile سطر يسهل
      # حذفه في تعديل لاحق بلا أن ينتبه أحد.
      - name: Images must not run as root
        run: |
          for image in superapp-api superapp-admin; do
            uid=$(docker run --rm --entrypoint id "$image:latest" -u)
            echo "$image runs as uid $uid"
            test "$uid" != "0" || { echo "$image runs as root"; exit 1; }
          done

      # الشيفرة داخل الصورة ملك root والعملية ليست root — فلا تستطيع إعادة
      # كتابة نفسها. الفحص يثبت أن الملكية لم تنقلب في تعديل لاحق.
      - name: Application code must be immutable at runtime
        run: |
          if docker run --rm --entrypoint sh superapp-api:latest \
               -c 'touch /repo/apps/api/dist/apps/api/src/.probe' 2>/dev/null; then
            echo "the running user can rewrite application code"
            exit 1
          fi
          echo "code is not writable by the runtime user"

      # دخان: الترتيب نفسه الذي يحدث على الخادم — القاعدة تصح، ثم تنجح
      # الهجرة وتخرج بصفر، ثم يقلع الـAPI واللوحة ويصيران سليمين.
      - name: Smoke-test the stack
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d db migrate api admin

          # ‏ExitCode يساوي 0 للحاويات العاملة أيضاً، فالحالة تُفحص معه:
          # المطلوب أن تكون الهجرة قد **انتهت** بنجاح لا أنها ما زالت تعمل.
          echo "--- migrate must have exited 0 ---"
          state=$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps -a \
            --format '{{.Service}} {{.State}} {{.ExitCode}}' | awk '$1=="migrate"{print $2" "$3}')
          test "$state" = "exited 0" || { echo "migrate: $state"; exit 1; }

          echo "--- wait for api and admin to report healthy ---"
          for i in $(seq 1 60); do
            healthy=$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps \
              --format '{{.Service}} {{.Health}}' | grep -c 'healthy' || true)
            [ "$healthy" -ge 3 ] && break
            sleep 5
          done

          echo "--- api answers, and reports the database up ---"
          docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api \
            wget -qO- http://127.0.0.1:3000/api/v1/health | tee /dev/stderr | grep -q '"db":"up"'

          echo "--- admin serves its login page ---"
          docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T admin \
            wget -qO- http://127.0.0.1:3001/login | grep -q '<title>'

          echo "--- admin reaches the api over the compose network ---"
          docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T admin \
            wget -qO- http://api:3000/api/v1/health | grep -q '"status":"ok"'

          echo "--- the seed runs from the shipped image ---"
          docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api \
            node -r ./dist/apps/api/src/register-paths.js dist/apps/api/src/db/seed/seed.js \
            | grep -q 'seed completed'

      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail 60

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod down -v

      # فحص الثغرات بعد الدخان لا قبله: خطأ في الحزمة نفسها أهم من ثغرة في
      # طبقة أساس، ولا معنى لفحص صورة لا تقلع أصلاً.
      #
      # يسقط على CRITICAL و HIGH القابلة للإصلاح فقط. ثغرة بلا رقعة متاحة
      # تُبلَّغ ولا توقف الدمج — لا يملك أحد إصلاحها اليوم، وحاجزٌ لا يمكن
      # تجاوزه يُتعلَّم تجاهله.
      - name: Scan images for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: superapp-api:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan the admin image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: superapp-admin:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # ‏SBOM لكل صورة: حين تُعلَن ثغرة في حزمة، السؤال الأول هو «هل هي
      # عندنا وفي أي إصدار؟» — الإجابة من ملف محفوظ لا من إعادة بناء صورة
      # قديمة قد لا تُبنى أصلاً.
      # ‏Trivy يكتب إلى المسار المعطى ولا ينشئ مجلده الأب
      - name: Prepare the SBOM directory
        run: mkdir -p sbom

      - name: SBOM for the API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: superapp-api:latest
          format: spdx-json
          output: sbom/superapp-api.spdx.json

      - name: SBOM for the admin image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: superapp-admin:latest
          format: spdx-json
          output: sbom/superapp-admin.spdx.json

      - name: Summarise the SBOMs
        run: |
          for f in sbom/*.spdx.json; do
            echo "$f: $(python3 -c "import json,sys;print(len(json.load(open('$f')).get('packages',[])))") packages"
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/*.spdx.json
          retention-days: 90

  # تطبيقات الهاتف لا يلمسها CI اليوم بشيء سوى typecheck. الحزمة تنكسر بأشياء
  # لا يراها المدقّق: استيراد وحدة غير موجودة، وتعارض إصدارات في رسم Metro،
  # وملحق Expo يفشل عند التهيئة. التصدير يشغّل ذلك كله فعلاً.
  #
  # ‏Android وحدها: لا ملفات ‎.ios/.android في المستودع، فرسم الوحدات واحد
  # للمنصتين — وتصدير الثانية يضاعف الزمن بلا أن يكشف شيئاً جديداً.
  expo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # تطبيق يسقط لا يخفي حال الآخرين
      fail-fast: false
      matrix:
        app: [customer, vendor, driver]

    env:
      EXPO_NO_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # الاختبارات قبل التصدير: أسرع، وتسقط على منطق مكسور بلا انتظار الحزم
      - name: Test ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: pnpm test

      - name: Export ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec expo export --platform android --output-dir dist-export

      # تصدير ينجح بحزمة فارغة يمرّ صامتاً بلا هذا الفحص. الحزم الفعلية
      # ‏5.5–5.7 ميغابايت، والحدّ عند واحد يكشف الانهيار بلا أن يرتجف مع النمو.
      - name: Assert the bundle is real
        working-directory: apps/${{ matrix.app }}
        run: |
          bundle=$(find dist-export -name '*.hbc' | head -1)
          test -n "$bundle" || { echo "no Hermes bundle produced"; ls -R dist-export; exit 1; }
          size=$(stat -c%s "$bundle")
          echo "$bundle  $((size / 1024 / 1024))MB"
          test "$size" -gt 1048576 || { echo "bundle is suspiciously small: $size bytes"; exit 1; }
