version: 2

# التثبيت بلا آلية تحديث يتحوّل إلى تعفّن: نُثبّت digest وSHA فتتجمّد الصور
# والإجراءات على نسخة تشيخ ثم تصير هي نفسها الثغرة. هذا الملف هو الطرف الآخر
# من التثبيت — يقترح الترقيات بـPR يمرّ على CI كأي تغيير.
updates:
  # ‏SHAs في .github/workflows — يحدّثها Dependabot ويُبقي تعليق الوسم
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']

  # ‏digestات صور الأساس في Dockerfileين
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/admin
    schedule:
      interval: weekly
      day: saturday
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # ‏Node مثبَّت على 22 LTS: هو ما تشغّله CI وما تصرّح به @types/node.
      # اقترح Dependabot 25-alpine — نسخة ليست LTS — وسقط الـdeploy عليها.
      # ترقية الإصدار الرئيسي قرار يُتخذ مرة، لا اقتراح أسبوعي.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # ‏postgis وcaddy في ملفات Compose
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: saturday
    commit-message:
      prefix: 'chore(deps)'

  # ‏npm أسبوعياً لا يومياً، وهذا مقصود: pnpm 11 يرفض افتراضياً أي حزمة
  # نُشرت خلال 24 ساعة (minimumReleaseAge)، وDependabot يقترح الأحدث دائماً.
  # اليومي يعني PRات تسقط CI بـERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION — وقد
  # حدث مرتين. الأسبوعي يصل والحزم قد تجاوزت المهلة.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # ترقيات الرقعة والثانوية في PR واحد بدل عشرة
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # والرئيسية في PR واحد أيضاً: تحتاج قراءة ملاحظات الإصدار وتجربة،
      # فمراجعة واحدة مركّزة أنفع من ثمانية PRات تُغلق بلا قراءة.
      major:
        patterns: ['*']
        update-types: ['major']
    ignore:
      # ——— حزم إصدارها الرئيسي مقيَّد بأداة أخرى ———
      # ترقيتها منفردة **خاطئة دائماً**، لا خطرة فحسب. أثبت ذلك أول أسبوع:
      # اقترح Dependabot الثلاثة، وسقطت الأولى والثانية في CI فوراً.
      #
      # ‏coverage-v8 يجب أن يطابق إصدار vitest الرئيسي — أُصلح هذا التضارب
      # فعلاً من قبل: 4.x مع vitest 3 يرمي عند تحميل المزوّد.
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      # ‏jest-expo مربوط بإصدار Expo SDK (54 هنا)
      - dependency-name: jest-expo
        update-types: ['version-update:semver-major']
      # ‏@types/node يتبع Node 22 المستعمل في CI وفي صور الإنتاج
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ‏jest مربوط بـjest-expo: هبطنا إلى 29 لأن 30 يكسره
      - dependency-name: jest
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']

      # ‏Expo وReact Native مثبّتة عبر overrides في pnpm-workspace.yaml،
      # وترقيتها تتم بـ`expo install --fix` لا بـPR اعتماديات.
      - dependency-name: expo
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: 'expo-*'
      - dependency-name: 'react-native-*'
      - dependency-name: '@expo/*'
